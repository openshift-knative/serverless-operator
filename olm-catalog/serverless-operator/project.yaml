project:
  name: serverless-operator
  # When bumping the Operator to a new version (major and minor), make sure to also update
  # all components in `dependencies.previous` to the same versions as `dependencies` in the same PR.
  # Otherwise, the upgrade tests will not pass, as we have a different SO version with the same bundle contents.
  # Also make sure to update values under `olm.previous` by copying from `olm.replaces` and `olm.skipRange`.
  version: 1.38.0
olm:
  replaces: 1.37.3
  skipRange: '>1.37.3 <1.38.0'
  channels:
    # The "global" operator default, used as "operators.operatorframework.io.bundle.channels.v1" annotation
    operator_default: stable
    # The default channel to use for CI
    default: stable
    list:
      - stable
      - stable-1.38
  previousBundles:
    # List of previous bundles to add to the generated index, also used in upgrade tests
    - version: 1.37.3
      replaces: 1.37.2
      skipRange: ">1.37.2 <1.37.3"
    - version: 1.37.2
      replaces: 1.37.1
      skipRange: ">1.37.1 <1.37.2"
    - version: 1.37.1
      replaces: 1.37.0
      skipRange: ">=1.37.0 <1.37.1"
    - version: 1.37.0
      replaces: 1.36.1
      skipRange: ">=1.36.1 <1.37.0"
    - version: 1.36.1
      replaces: 1.36.0
      skipRange: ">=1.36.0 <1.36.1"
    - version: 1.36.0
      replaces: 1.35.0
      skipRange: ">=1.35.0 <1.36.0"
    - version: 1.35.0
      replaces: 1.34.0
      skipRange: ">=1.34.0 <1.35.0"
requirements:
  kube:
    # The min version validation in `vendor/knative.dev/pkg/version/version.go`
    # is ignored as it is overridden by fake version via KUBERNETES_MIN_VERSION.
    # This value is used for CSV's min version validation.
    minVersion: 1.30.0
  golang: '1.26'
  nodejs: 20.x
  ocpVersion:
    list:
      - "4.18"
      - "4.19"
      - "4.20"
      - "4.21"
      - "4.22"
      - "4.23"
      - "5.0"
      - "5.1"
    min: '4.18'
    # Version to use for OCP docs links (in CSV or Quickstarts)
    doc: '5.0'
    # deprecated, use requirements.ocpVersion.list[-1]
    max: '5.1'
    # version to use in Dockerfiles
    build: '5.0'
    label: 'v4.18'
    # OCP stream for kube-rbac-proxy image.
    kube-rbac-proxy: "5.0"
dependencies:
  serving: knative-v1.21
  # serving midstream branch name
  serving_artifacts_branch: release-v1.21
  # versions for networking components
  kourier: knative-v1.21
  net_kourier_artifacts_branch: release-v1.21
  net_istio: knative-v1.21
  net_istio_artifacts_branch: release-v1.21
  redhat-knative-istio-authz-chart: 1.37.0
  service_mesh_proxy: registry.redhat.io/openshift-service-mesh/proxyv2-rhel9@sha256:f342f06f4ebdbad82d5bcd8c287f0edaf627703442dbda7238adde13349bb893
  eventing: knative-v1.21
  # eventing core midstream branch name
  eventing_artifacts_branch: release-v1.21
  # eventing-kafka-broker promotion tag
  eventing_kafka_broker: knative-v1.21
  # eventing-kafka-broker midstream branch or commit
  eventing_kafka_broker_artifacts_branch: release-v1.21
  # eventing-integrations promotion tag
  eventing_integrations: knative-v1.21
  # eventing-integrations midstream branch or commit
  eventing_integrations_artifacts_branch: release-v1.21
  # eventing-istio promotion tag
  eventing_istio: knative-v1.21
  # eventing-istio midstream branch or commit
  eventing_istio_artifacts_branch: release-v1.21
  cli: knative-v1.21
  kube_rbac_proxy: registry.redhat.io/openshift5/ose-kube-rbac-proxy-rhel9@sha256:2b238541cb39357dcde3a00323e555c0e0150d7584f6703daba4a9311d6abc79
  func:
    promotion_tag: knative-v1.21
    # if additional image is added amend the list in hack/generate/dependencies.sh
    tekton_buildah: registry.redhat.io/rhel9/buildah@sha256:c051b9220a4c348e8c28c7d7d1ff376f5f32e916e5587a057677be74234504e8
    nodejs_20_minimal: registry.access.redhat.com/ubi9/nodejs-20-minimal@sha256:87f2eb0ce06e922a7629fa94fad62ed4e6be05931852b779269e0692282a099e
    openjdk_21: registry.access.redhat.com/ubi9/openjdk-21@sha256:4daa3f2fa0f2f64cc7732dca63ef1ed7c53ff4883cc18571d6f8eca7a8458b46
    python-39: registry.access.redhat.com/ubi9/python-39@sha256:447a4c9f6ead4f063bed8778793ac9e972004e5a55d103b375de83c885887e50
  operator: 1.21.0
  # Previous versions required for downgrade testing
  previous:
    serving: knative-v1.17
    eventing: knative-v1.17
    eventing_kafka_broker: knative-v1.17
