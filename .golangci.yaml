version: "2"

run:
  timeout: 5m
  build-tags:
    - upgrade

linters:
  enable:
    - asciicheck
    - bidichk
    - errorlint
    - gosec
    - importas
    - misspell
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
  disable:
    - errcheck

  settings:
    importas:
      no-unaliased: true
      alias:
        - pkg: k8s.io/apimachinery/pkg/apis/(\w+)/(v[\w\d]+)
          alias: $1$2
        - pkg: k8s.io/api/(\w+)/(v[\w\d]+)
          alias: $1$2
        - pkg: github.com/openshift/api/(\w+)/(v[\w\d]+)
          alias: $1$2
        - pkg: knative.dev/serving/pkg/apis/(\w+)/(v[\w\d]+)
          alias: $1$2
        - pkg: knative.dev/eventing/pkg/apis/(\w+)/(v[\w\d]+)
          alias: $1$2
        - pkg: knative.dev/pkg/apis/(\w+)/(v[\w\d]+)
          alias: $1$2
        - pkg: knative.dev/operator/pkg/apis/operator/(\w+)/(v[\w\d]+)
          alias: $1$2
        - pkg: github.com/prometheus-operator/prometheus-operator/pkg/apis/(\w+)/(v[\w\d]+)
          alias: $1$2
        - pkg: github.com/operator-framework/api/pkg/(\w+)/(v[\w\d]+)
          alias: $1$2

  exclusions:
    generated: lax
    rules:
      # Exclude all issues from pkg/client directory
      - path: pkg/client/
        linters:
          - asciicheck
          - bidichk
          - errorlint
          - gosec
          - importas
          - misspell
          - prealloc
          - revive
          - staticcheck
          - unconvert
          - unparam

      # Exclude test files from specific linters
      - path: test
        linters:
          - gosec
          - unparam

      # Exclude "should have comment" from revive
      - text: "should have comment"
        linters:
          - revive

      # TEMPORARY: Exclude warnings found in golangci-lint v2.13.2 upgrade
      # TODO: Remove these exclusions once all 37 issues are addressed
      # Reference: https://github.com/openshift-knative/serverless-operator/actions/runs/35051701089/job/104653278982?pr=4168

      # Temporarily exclude gosec rules (8 issues: G304, G101, G104)
      - linters:
          - gosec
        text: "G304|G101|G104"

      # Temporarily exclude prealloc suggestions (6 issues)
      - path: ".*"
        linters:
          - prealloc

      # Temporarily exclude staticcheck refactoring suggestions (13 issues: QF1008, QF1001)
      - linters:
          - staticcheck
        text: "QF1008|QF1001"

      # Temporarily exclude revive comment requirements (10 issues: package-comments, exported)
      - linters:
          - revive
        text: "package-comments|exported"

formatters:
  enable:
    - gofmt
    - goimports
